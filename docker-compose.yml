version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: enterprisedoc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: enterprisedoc
      POSTGRES_PASSWORD: enterprise_secure_password
      POSTGRES_DB: enterprisedoc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprisedoc -d enterprisedoc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprisedoc-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://enterprisedoc:enterprise_secure_password@db:5432/enterprisedoc_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-1.5-flash
      - EMBEDDING_MODEL_NAME=BAAI/bge-small-en-v1.5
      - RERANKER_MODEL_NAME=cross-encoder/ms-marco-MiniLM-L-6-v2
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/data/uploads
      - backend_vector_store:/app/data/vector_store
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enterprisedoc-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
  backend_vector_store:
